[build]
  # `prisma migrate deploy` usa uma trava de sessão (pg_advisory_lock) que
  # não funciona de forma confiável através de um pooler/PgBouncer (ex. Neon
  # "-pooler") — causa timeouts intermitentes (erro P1002). Rodamos só esse
  # comando com DATABASE_URL trocado pra DIRECT_DATABASE_URL (conexão direta,
  # sem pooler) quando ela existir; sem essa variável definida, cai no mesmo
  # DATABASE_URL de sempre (nenhuma mudança de comportamento). Ver README,
  # seção "Banco de dados", pra configurar DIRECT_DATABASE_URL.
  command = "npm ci --include=dev && npx prisma generate && DATABASE_URL=${DIRECT_DATABASE_URL:-$DATABASE_URL} npx prisma migrate deploy && cd sgcl-web && npm ci --include=dev && npm run build"
  publish = "sgcl-web/dist"

[build.environment]
  NODE_VERSION = "20"
  NODE_ENV = "production"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[functions.api]
  included_files = ["node_modules/.prisma/client/**"]

# Chamadas de API do frontend vão para /api/*, resolvidas pela function.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

# Fallback de SPA: qualquer outra rota cai no index.html (React Router cuida do resto).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
